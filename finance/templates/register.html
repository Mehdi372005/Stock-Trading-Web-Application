{% extends "layout.html" %}

{% block title %}
    Registration
{% endblock %}

{% block main %}

    <form action="/register" method="post">
        <div class="mb-3">
            <input name="username" minlength="8" type="text" placeholder="enter name">
        </div>
        <div>
            <input name="password" minlength="8" type="password" placeholder="Password">
        </div class="mb-3">

        <div class="mb-3">
            <input name="confirmation" minlength="8" type="password" placeholder="confirm password">
        </div>

        <button type="submit" class="btn btn-primary"> register</button>
    </form>

{% endblock %}
